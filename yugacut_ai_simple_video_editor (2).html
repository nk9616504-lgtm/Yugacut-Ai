<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>YugaCut AI — Simple Video Editor</title>
  <meta name="theme-color" content="#ffffff" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    html, body {
      background: #ffffff;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    .yc-scroll::-webkit-scrollbar { display: none; }
    .yc-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .yc-tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      padding: 6px 4px;
      gap: 3px;
      color: #374151;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .yc-tool-btn i { font-size: 15px; }
    .yc-tool-btn span { font-size: 9px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
    .yc-tool-btn.active { color: #ff5722; }
    .yc-range {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #e5e7eb;
      border-radius: 999px;
      outline: none;
    }
    .yc-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #ff5722;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-gray-800 select-none">

  <!-- Hidden File Inputs -->
  <input id="ycMediaInput" type="file" accept="video/*,image/*" multiple class="hidden" onchange="handleMediaFiles(this.files)" />
  <input id="ycAudioInput" type="file" accept="audio/*" class="hidden" onchange="handleAudioUpload(this.files)" />
  <input id="ycExtractVideoInput" type="file" accept="video/*" class="hidden" onchange="handleExtractAudioFromVideo(this.files)" />
  <input id="ycPngStickerInput" type="file" accept="image/png,image/webp,image/*" class="hidden" onchange="handleCustomPngSticker(this.files)" />
  <input id="ycPipInput" type="file" accept="image/*" class="hidden" onchange="handlePipUpload(this.files)" />

  <!-- ==================== 1. HOME / LAUNCHER SCREEN ==================== -->
  <div id="ycHomeScreen" class="fixed inset-0 z-30 flex flex-col justify-between bg-[#dce4e8] text-gray-800">
    <div class="flex items-center justify-between px-4 pt-4">
      <div class="flex items-center gap-2">
        <span class="text-2xl font-black tracking-tight text-white drop-shadow-sm">YugaCut</span>
        <span class="bg-white text-[#ff5722] text-[11px] font-extrabold px-2 py-0.5 rounded-full shadow-sm">Free</span>
      </div>
      <button type="button" onclick="openEditorDirectly()" class="w-9 h-9 rounded-full bg-white/80 hover:bg-white flex items-center justify-center text-gray-700 shadow-sm" title="Open Editor">
        <i class="fa-solid fa-sliders text-sm"></i>
      </button>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
      <div class="w-24 h-24 rounded-3xl bg-white/90 shadow-md flex items-center justify-center mb-5">
        <i class="fa-solid fa-clapperboard text-4xl text-[#ff5722]"></i>
      </div>
      <h1 class="text-lg font-bold text-gray-800 mb-1">Simple &amp; Clean Video Editor</h1>
      <p class="text-xs text-gray-600 mb-6">Multi-Track Timeline, PNG Stickers, Music Waveform, Transitions — No Watermark</p>

      <div class="w-full max-w-xs space-y-2.5">
        <button type="button" onclick="triggerNewProject()" class="w-full py-3 rounded-xl bg-[#ff5722] hover:bg-[#f4511e] text-white font-bold text-sm tracking-wide shadow-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus"></i> NEW PROJECT
        </button>
        <button type="button" onclick="openEditorDirectly()" class="w-full py-2.5 rounded-xl bg-white hover:bg-gray-50 text-gray-700 font-semibold text-xs shadow-sm flex items-center justify-center gap-2">
          <i class="fa-solid fa-folder-open text-[#ff5722]"></i> OPEN WORKSPACE
        </button>
      </div>
    </div>

    <div class="pb-7 flex items-center justify-center gap-8">
      <button type="button" onclick="openEditorWithTool('captions')" class="w-12 h-12 rounded-full bg-white shadow flex items-center justify-center text-gray-700 text-xs font-extrabold" title="Captions">Ai</button>
      <button type="button" onclick="triggerNewProject()" class="w-14 h-14 rounded-full bg-white shadow-lg flex items-center justify-center text-[#ff5722] text-xl" title="New Project"><i class="fa-solid fa-plus"></i></button>
      <button type="button" onclick="openEditorWithTool('music')" class="w-12 h-12 rounded-full bg-white shadow flex items-center justify-center text-gray-700 text-base" title="Music"><i class="fa-solid fa-music"></i></button>
    </div>
  </div>

  <!-- ==================== 2. MAIN EDITOR SCREEN ==================== -->
  <div id="ycEditorScreen" class="min-h-screen flex flex-col justify-between bg-white">

    <!-- TOP BAR -->
    <header class="px-3 py-2 flex items-center justify-between border-b border-gray-100 bg-white">
      <div class="flex items-center gap-2">
        <button type="button" onclick="goHome()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600" title="Back">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>
        <span class="text-sm font-extrabold text-gray-800">YugaCut</span>
        <select id="ycRatioSelect" onchange="setAspectRatio(this.value)" class="ml-1 rounded-md bg-gray-100 border border-gray-200 px-2 py-1 text-[11px] font-semibold text-gray-700">
          <option value="9:16">9:16</option>
          <option value="16:9">16:9</option>
          <option value="1:1">1:1</option>
          <option value="4:5">4:5</option>
        </select>
      </div>
      <button type="button" onclick="openExportModal()" class="bg-[#ff5722] hover:bg-[#f4511e] text-white font-bold px-4 py-1.5 rounded-md text-xs tracking-wide shadow-sm">
        SAVE
      </button>
    </header>

    <!-- PREVIEW STAGE -->
    <main class="flex-1 flex flex-col items-center justify-center bg-[#f4f5f7] px-3 py-1.5 relative overflow-hidden">
      <div id="ycStageWrap" class="relative bg-black rounded-md overflow-hidden shadow-md flex items-center justify-center" style="width: 190px; height: 326px;">
        <canvas id="ycPreviewCanvas" width="540" height="960" class="w-full h-full object-contain touch-none cursor-move"></canvas>
        <button id="ycEmptyTap" type="button" onclick="document.getElementById('ycMediaInput').click()" class="absolute inset-0 flex flex-col items-center justify-center bg-black/50 text-white gap-2 hover:bg-black/40 transition">
          <span class="w-11 h-11 rounded-full bg-[#ff5722] flex items-center justify-center text-lg shadow"><i class="fa-solid fa-plus"></i></span>
          <span class="text-xs font-semibold">Tap to add Video or Photo</span>
        </button>
      </div>
    </main>

    <!-- TRANSPORT BAR -->
    <div class="bg-white border-t border-gray-100 px-3 py-1 flex items-center justify-between">
      <div class="flex items-center gap-2 text-gray-500">
        <button type="button" onclick="undoAction()" class="p-1.5 hover:text-gray-800" title="Undo"><i class="fa-solid fa-rotate-left text-sm"></i></button>
        <button type="button" onclick="redoAction()" class="p-1.5 hover:text-gray-800" title="Redo"><i class="fa-solid fa-rotate-right text-sm"></i></button>
      </div>
      <div class="flex items-center gap-4 text-gray-800">
        <button type="button" onclick="seekTo(0, true)" class="p-1.5 hover:text-[#ff5722]" title="Start"><i class="fa-solid fa-backward-step text-sm"></i></button>
        <button type="button" id="ycPlayBtn" onclick="togglePlay()" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-900 hover:bg-gray-100" title="Play / Pause">
          <i class="fa-solid fa-play text-base"></i>
        </button>
      </div>
      <div class="flex items-center gap-1 text-gray-500">
        <button type="button" onclick="zoomTimeline(-8)" class="px-1.5 py-1 text-[11px] font-bold hover:text-gray-800" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button type="button" onclick="zoomTimeline(8)" class="px-1.5 py-1 text-[11px] font-bold hover:text-gray-800" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button type="button" onclick="toggleFullscreenPreview()" class="p-1.5 hover:text-gray-800" title="Fullscreen"><i class="fa-solid fa-expand text-sm"></i></button>
      </div>
    </div>

    <!-- COLLAPSIBLE TOOL DRAWER -->
    <div id="ycToolDrawer" class="hidden bg-[#fafafa] border-t border-gray-200 px-3 py-2.5">
      <div class="flex items-center justify-between mb-2">
        <span id="ycDrawerTitle" class="text-[11px] font-bold uppercase tracking-wider text-gray-700">Tool</span>
        <button type="button" onclick="closeToolDrawer()" class="text-[11px] font-bold text-[#ff5722] px-2 py-0.5 rounded hover:bg-orange-50">Done</button>
      </div>
      <div id="ycDrawerBody" class="space-y-2 text-xs"></div>
    </div>

    <!-- HORIZONTAL COMPACT ICON TOOLBAR -->
    <div class="bg-white border-t border-gray-100 flex items-center">
      <button id="ycCollapseBtn" type="button" onclick="deselectAll()" class="hidden px-2.5 py-2 border-r border-gray-100 text-gray-500 hover:text-gray-800" title="Back to main tools">
        <i class="fa-solid fa-chevron-down text-xs"></i>
      </button>
      <div id="ycToolbarRow" class="flex-1 flex items-center overflow-x-auto yc-scroll px-1"></div>
    </div>

    <!-- BOTTOM MULTI-TRACK TIMELINE (YouCut Fixed Playhead + Smooth Track Glide!) -->
    <div class="bg-white border-t border-gray-100 pt-1.5 pb-2 px-2">
      <div class="flex items-stretch gap-2">
        <!-- Left Fixed Controls -->
        <div class="w-20 flex-shrink-0 flex flex-col items-center justify-center gap-2">
          <button type="button" onclick="document.getElementById('ycMediaInput').click()" class="w-10 h-10 rounded-full bg-[#ff5722] hover:bg-[#f4511e] text-white shadow-md flex items-center justify-center text-lg" title="Add Video or Photo">
            <i class="fa-solid fa-plus"></i>
          </button>
          <button type="button" id="ycMuteBtn" onclick="toggleGlobalMute()" class="flex flex-col items-center text-[9px] font-semibold text-gray-600 leading-tight">
            <i class="fa-solid fa-volume-high text-xs mb-0.5 text-[#ff5722]"></i>
            <span>Mute clip</span>
          </button>
        </div>

        <!-- Right Scrollable Multi-Track Timeline with Fixed Center-Left Playhead -->
        <div class="flex-1 relative bg-[#f8f9fa] rounded-lg border border-gray-200 overflow-hidden">
          <!-- Fixed Red Playhead Line (Tracks glide smoothly underneath!) -->
          <div id="ycPlayhead" class="pointer-events-none absolute top-0 bottom-0 w-[2px] bg-[#ff5722] z-30" style="left: 44px;">
            <div class="w-2.5 h-2.5 bg-[#ff5722] rounded-full -ml-[4px] -mt-0.5 shadow"></div>
          </div>

          <div id="ycTimelineViewport" class="w-full overflow-x-auto yc-scroll py-1.5" onscroll="handleTimelineScroll()">
            <!-- Inner Track Canvas with 44px left offset + right scroll buffer so 0:00 sits under Playhead -->
            <div id="ycTracksWrap" class="relative space-y-1" style="padding-left: 44px; padding-right: 260px; min-width: 100%;">
              <!-- Time Ruler -->
              <div id="ycRulerTrack" class="h-3.5 relative text-[9px] font-semibold text-gray-400 select-none"></div>
              <!-- Multi-Lane Text / Sticker / PNG / PIP Tracks -->
              <div id="ycOverlayLanes" class="space-y-1"></div>
              <!-- Multi-Lane Audio / Music / Voiceover Tracks -->
              <div id="ycAudioLanes" class="space-y-1"></div>
              <!-- Main Video / Photo Filmstrip Track (Zero-Gap Joined Clips + Transition Seams) -->
              <div id="ycVideoTrack" class="h-12 flex items-center gap-0"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-1 px-2 flex items-center justify-between text-[11px] font-semibold text-gray-500">
        <span id="ycCurrentTime">0:00.0</span>
        <span id="ycTotalTime">Total 0:00.0</span>
      </div>
    </div>
  </div>

  <!-- ==================== 3. MUSIC / AUDIO PICKER & WAVEFORM TRIMMER MODAL ==================== -->
  <div id="ycMusicModal" class="hidden fixed inset-0 z-40 bg-white flex flex-col">
    <div class="px-3 py-3 border-b border-gray-100 flex items-center gap-3">
      <button type="button" onclick="closeMusicModal()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-700">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <span class="text-base font-bold text-gray-800">Music</span>
    </div>

    <div class="grid grid-cols-3 border-b border-gray-100 text-xs font-bold text-center">
      <button type="button" id="ycTabMyMusic" onclick="switchMusicTab('mymusic')" class="py-2.5 text-[#ff5722] border-b-2 border-[#ff5722]">MY MUSIC</button>
      <button type="button" id="ycTabEffects" onclick="switchMusicTab('effects')" class="py-2.5 text-gray-500">EFFECTS</button>
      <button type="button" id="ycTabVoice" onclick="switchMusicTab('voice')" class="py-2.5 text-gray-500">VOICEOVER</button>
    </div>

    <div id="ycMusicBody" class="flex-1 overflow-y-auto p-4 space-y-4 pb-44"></div>

    <!-- BOTTOM WAVEFORM TRIMMER BAR -->
    <div id="ycAudioTrimmerBar" class="hidden fixed bottom-0 left-0 right-0 bg-[#2b2b2b] text-white p-3 shadow-2xl border-t border-gray-700 z-50">
      <div class="flex items-center justify-between text-[11px] font-semibold text-gray-300 mb-1.5">
        <span id="ycTrimAudioStart">0:00.0</span>
        <span id="ycTrimAudioMid" class="text-white">0:00.0 / 0:00.0</span>
        <span id="ycTrimAudioEnd">0:00.0</span>
      </div>
      <div class="relative h-12 bg-[#1f1f1f] rounded-md overflow-hidden mb-2.5 flex items-center px-1">
        <canvas id="ycWaveformCanvas" width="400" height="44" class="w-full h-full"></canvas>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-3 text-[10px] text-gray-300">
        <div>
          <div class="flex justify-between mb-0.5"><span>Start Cut</span><span id="ycTrimStartVal">0.0s</span></div>
          <input id="ycAudioTrimStartSlider" type="range" min="0" max="100" step="0.1" value="0" oninput="updateAudioTrimPreview()" class="w-full yc-range" />
        </div>
        <div>
          <div class="flex justify-between mb-0.5"><span>End Cut</span><span id="ycTrimEndVal">0.0s</span></div>
          <input id="ycAudioTrimEndSlider" type="range" min="0" max="100" step="0.1" value="100" oninput="updateAudioTrimPreview()" class="w-full yc-range" />
        </div>
      </div>
      <div class="flex items-center justify-between gap-3">
        <button type="button" id="ycAudioPreviewPlayBtn" onclick="toggleAudioPreviewPlay()" class="w-9 h-9 rounded-full bg-white text-gray-900 flex items-center justify-center flex-shrink-0 shadow">
          <i class="fa-solid fa-play text-xs"></i>
        </button>
        <div class="flex-1 min-w-0">
          <div id="ycTrimAudioName" class="text-xs font-semibold truncate">Selected Audio</div>
          <div id="ycTrimAudioDur" class="text-[10px] text-gray-400">0:00.0</div>
        </div>
        <button type="button" onclick="confirmUseTrimmedAudio()" class="bg-[#ff5722] hover:bg-[#f4511e] text-white font-bold text-xs px-5 py-2 rounded-md shadow">
          USE
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 4. EXPORT / SAVE / SHARE MODAL ==================== -->
  <div id="ycExportModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-3">
    <div class="bg-white rounded-2xl w-full max-w-sm p-4 space-y-3 shadow-xl">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-gray-800">Save &amp; Compress Video</h2>
        <button type="button" onclick="closeExportModal()" class="text-gray-400 hover:text-gray-700"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-2 text-xs">
        <div>
          <label class="block text-gray-500 font-semibold mb-1">Resolution</label>
          <select id="ycExportRes" class="w-full border border-gray-200 rounded-lg px-2.5 py-2 bg-gray-50 font-semibold">
            <option value="720">720p HD (Balanced)</option>
            <option value="1080">1080p Full HD (High)</option>
            <option value="480">480p (Compressed / Small Size)</option>
          </select>
        </div>
        <div>
          <label class="block text-gray-500 font-semibold mb-1">Frame Rate</label>
          <select id="ycExportFps" class="w-full border border-gray-200 rounded-lg px-2.5 py-2 bg-gray-50 font-semibold">
            <option value="30">30 FPS</option>
            <option value="24">24 FPS</option>
          </select>
        </div>
      </div>
      <div id="ycExportProgressWrap" class="hidden space-y-1.5">
        <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
          <div id="ycExportBar" class="bg-[#ff5722] h-2 transition-all" style="width: 0%;"></div>
        </div>
        <div id="ycExportStatus" class="text-[11px] text-center text-gray-600 font-semibold">Preparing...</div>
      </div>
      <div class="flex gap-2">
        <button type="button" id="ycStartExportBtn" onclick="startVideoExport(false)" class="flex-1 py-2.5 rounded-xl bg-[#ff5722] hover:bg-[#f4511e] text-white font-bold text-xs shadow">
          SAVE VIDEO
        </button>
        <button type="button" onclick="startVideoExport(true)" class="px-4 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-xs">
          <i class="fa-solid fa-share-nodes"></i> Share
        </button>
      </div>
    </div>
  </div>

  <div id="ycToast" class="hidden fixed top-14 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg"></div>

  <script>
    // ==================== STATE ====================
    const state = {
      clips: [],
      audioClips: [],
      overlays: [], // { id, kind: 'text'|'sticker'|'badge'|'png', text, badgeType, imgEl, x, y, size, color, bgColor, startAt, duration }
      bgMode: 'black',
      selectedClipId: null,
      selectedAudioId: null,
      selectedOverlayId: null,
      selectedTransitionIdx: null,
      activeTool: null,
      ratio: '9:16',
      mutedGlobal: false,
      isPlaying: false,
      playhead: 0,
      totalDuration: 0,
      pxPerSec: 34,
      suppressScrollSync: false,
      history: [],
      redoStack: [],
      musicLibrary: [],
      currentMusicTab: 'mymusic',
      pendingAudio: null,
      mediaRecorder: null,
      voiceChunks: [],
      isRecordingVoice: false
    };

    const FILTER_PRESETS = [
      { id: 'none', name: 'Normal', css: '' },
      { id: 'vivid', name: 'Vivid', css: 'saturate(1.35) contrast(1.08)' },
      { id: 'warm', name: 'Warm', css: 'sepia(0.25) saturate(1.2) brightness(1.03)' },
      { id: 'cool', name: 'Cool', css: 'hue-rotate(185deg) saturate(0.95)' },
      { id: 'bw', name: 'B&W', css: 'grayscale(1) contrast(1.1)' },
      { id: 'vintage', name: 'Vintage', css: 'sepia(0.45) contrast(0.95)' }
    ];

    const FX_PRESETS = [
      { id: 'none', name: 'None' },
      { id: 'zoom', name: 'Slow Zoom' },
      { id: 'pulse', name: 'Beat Pulse' },
      { id: 'vignette', name: 'Vignette' },
      { id: 'flash', name: 'Flash' },
      { id: 'shake', name: 'Shake' }
    ];

    const TRANSITIONS = [
      { id: 'none', name: 'None' },
      { id: 'fade', name: 'Fade' },
      { id: 'slideLeft', name: 'Slide Left' },
      { id: 'slideRight', name: 'Slide Right' },
      { id: 'zoomIn', name: 'Zoom In' }
    ];

    const BG_MODES = [
      { id: 'black', name: 'Black', color: '#000000' },
      { id: 'blur', name: 'Blur', color: '#4b5563' },
      { id: 'white', name: 'White', color: '#ffffff' },
      { id: 'soft', name: 'Soft Gray', color: '#e5e7eb' },
      { id: 'warm', name: 'Warm', color: '#fef3c7' }
    ];

    const BADGE_STICKERS = [
      { id: 'sub', label: '▶ SUBSCRIBE', bg: '#dc2626', fg: '#ffffff' },
      { id: 'like', label: '👍 LIKE', bg: '#2563eb', fg: '#ffffff' },
      { id: 'bell', label: '🔔 BELL ON', bg: '#f59e0b', fg: '#111827' },
      { id: 'share', label: '↗ SHARE', bg: '#10b981', fg: '#ffffff' },
      { id: 'follow', label: '+ FOLLOW', bg: '#ec4899', fg: '#ffffff' },
      { id: 'live', label: '● LIVE', bg: '#ef4444', fg: '#ffffff' }
    ];

    const STICKERS = ['❤️', '🔥', '😂', '✨', '👍', '🎉', '🎶', '⭐', '🙏', '💯'];

    const SFX_PRESETS = [
      { id: 'sfx_pop', name: 'Pop Bubble', dur: 0.4, freq: 520 },
      { id: 'sfx_ding', name: 'Bell Ding', dur: 0.9, freq: 880 },
      { id: 'sfx_whoosh', name: 'Whoosh', dur: 0.7, freq: 240 },
      { id: 'sfx_click', name: 'Snap Click', dur: 0.25, freq: 1100 }
    ];

    const canvas = document.getElementById('ycPreviewCanvas');
    const ctx = canvas.getContext('2d');
    let rafId = null;
    let lastTick = 0;

    function showToast(msg) {
      const t = document.getElementById('ycToast');
      if (!t) return;
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2600);
    }

    // ==================== NAVIGATION ====================
    function triggerNewProject() {
      document.getElementById('ycHomeScreen').classList.add('hidden');
      document.getElementById('ycMediaInput').click();
    }

    function openEditorDirectly() {
      document.getElementById('ycHomeScreen').classList.add('hidden');
      renderToolbar();
      renderTimeline();
      drawFrame();
    }

    function openEditorWithTool(tool) {
      openEditorDirectly();
      if (tool === 'music') openMusicModal();
      else openTool(tool);
    }

    function goHome() {
      pausePlayback();
      document.getElementById('ycHomeScreen').classList.remove('hidden');
    }

    function setAspectRatio(ratio) {
      state.ratio = ratio;
      const wrap = document.getElementById('ycStageWrap');
      if (ratio === '9:16') { canvas.width = 540; canvas.height = 960; wrap.style.width = '190px'; wrap.style.height = '326px'; }
      else if (ratio === '16:9') { canvas.width = 960; canvas.height = 540; wrap.style.width = '310px'; wrap.style.height = '174px'; }
      else if (ratio === '1:1') { canvas.width = 720; canvas.height = 720; wrap.style.width = '240px'; wrap.style.height = '240px'; }
      else if (ratio === '4:5') { canvas.width = 720; canvas.height = 900; wrap.style.width = '210px'; wrap.style.height = '262px'; }
      drawFrame();
    }

    // ==================== UNDO / REDO ====================
    function saveSnapshot() {
      const snap = JSON.stringify({
        clips: state.clips.map(c => ({ ...c, mediaEl: null })),
        audioClips: state.audioClips.map(a => ({ ...a, audioEl: null })),
        overlays: state.overlays.map(o => ({ ...o, imgEl: null })),
        bgMode: state.bgMode
      });
      state.history.push(snap);
      if (state.history.length > 20) state.history.shift();
      state.redoStack = [];
    }

    function restoreSnapshot(snapStr) {
      const data = JSON.parse(snapStr);
      const mediaById = Object.fromEntries(state.clips.map(c => [c.id, c.mediaEl]));
      const audioById = Object.fromEntries(state.audioClips.map(a => [a.id, a.audioEl]));
      const imgById = Object.fromEntries(state.overlays.map(o => [o.id, o.imgEl]));
      state.clips = data.clips.map(c => ({ ...c, mediaEl: mediaById[c.id] }));
      state.audioClips = data.audioClips.map(a => ({ ...a, audioEl: audioById[a.id] }));
      state.overlays = data.overlays.map(o => ({ ...o, imgEl: imgById[o.id] }));
      state.bgMode = data.bgMode || 'black';
      recomputeDuration();
      renderTimeline();
      drawFrame();
    }

    function undoAction() {
      if (!state.history.length) return;
      state.redoStack.push(JSON.stringify({
        clips: state.clips.map(c => ({ ...c, mediaEl: null })),
        audioClips: state.audioClips.map(a => ({ ...a, audioEl: null })),
        overlays: state.overlays.map(o => ({ ...o, imgEl: null })),
        bgMode: state.bgMode
      }));
      restoreSnapshot(state.history.pop());
    }

    function redoAction() {
      if (!state.redoStack.length) return;
      state.history.push(JSON.stringify({
        clips: state.clips.map(c => ({ ...c, mediaEl: null })),
        audioClips: state.audioClips.map(a => ({ ...a, audioEl: null })),
        overlays: state.overlays.map(o => ({ ...o, imgEl: null })),
        bgMode: state.bgMode
      }));
      restoreSnapshot(state.redoStack.pop());
    }

    // ==================== MEDIA IMPORT + FILMSTRIP ====================
    async function handleMediaFiles(fileList) {
      if (!fileList || !fileList.length) return;
      document.getElementById('ycHomeScreen').classList.add('hidden');
      document.getElementById('ycEmptyTap').classList.add('hidden');
      saveSnapshot();

      for (const file of Array.from(fileList)) {
        const url = URL.createObjectURL(file);
        const isVideo = file.type.startsWith('video/');
        const id = 'clip_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

        if (isVideo) {
          const video = document.createElement('video');
          video.src = url;
          video.playsInline = true;
          video.muted = true;
          video.preload = 'auto';
          await new Promise(res => { video.onloadedmetadata = res; video.onerror = res; });
          const dur = isFinite(video.duration) && video.duration > 0 ? video.duration : 5;
          const clip = {
            id, type: 'video', name: file.name, url, mediaEl: video,
            duration: dur, trimStart: 0, trimEnd: dur,
            speed: 1, volume: 1, rotate: 0, flipH: false, flipV: false, cropScale: 1,
            filter: 'none', fx: 'none', adj: { b: 100, c: 100, s: 100 },
            transitionAfter: 'none', thumbs: []
          };
          state.clips.push(clip);
          recomputeDuration();
          renderTimeline();
          drawFrame();
          extractVideoFilmstrip(clip, url);
        } else {
          const img = new Image();
          img.src = url;
          await new Promise(res => { img.onload = res; img.onerror = res; });
          const clip = {
            id, type: 'image', name: file.name, url, mediaEl: img,
            duration: 3, trimStart: 0, trimEnd: 3,
            speed: 1, volume: 1, rotate: 0, flipH: false, flipV: false, cropScale: 1,
            filter: 'none', fx: 'none', adj: { b: 100, c: 100, s: 100 },
            transitionAfter: 'fade', thumbs: [url]
          };
          state.clips.push(clip);
          recomputeDuration();
          renderTimeline();
          drawFrame();
        }
      }
      document.getElementById('ycMediaInput').value = '';
    }

    async function extractVideoFilmstrip(clip, url) {
      try {
        const probe = document.createElement('video');
        probe.src = url;
        probe.muted = true;
        probe.playsInline = true;
        await new Promise(r => { probe.onloadeddata = r; probe.onerror = r; });

        const c = document.createElement('canvas');
        c.width = 72; c.height = 72;
        const cctx = c.getContext('2d');
        const count = Math.min(10, Math.max(4, Math.ceil(clip.duration / 3)));
        const thumbs = [];

        for (let i = 0; i < count; i++) {
          probe.currentTime = Math.min(clip.duration - 0.05, (i / count) * clip.duration + 0.05);
          await new Promise(r => {
            const onSeek = () => { probe.removeEventListener('seeked', onSeek); r(); };
            probe.addEventListener('seeked', onSeek);
            setTimeout(r, 350);
          });
          cctx.drawImage(probe, 0, 0, c.width, c.height);
          thumbs.push(c.toDataURL('image/jpeg', 0.6));
        }
        clip.thumbs = thumbs;
        renderTimeline();
      } catch (e) {}
    }

    // ==================== MULTI-TRACK TIMELINE + FIXED PLAYHEAD SCRUBBING ====================
    function getClipEffectiveDur(c) {
      return Math.max(0.2, (c.trimEnd - c.trimStart) / (c.speed || 1));
    }

    function recomputeDuration() {
      let total = 0;
      for (const c of state.clips) total += getClipEffectiveDur(c);
      for (const a of state.audioClips) {
        const aEnd = a.startAt + Math.max(0.2, (a.trimEnd - a.trimStart) / (a.speed || 1));
        if (aEnd > total) total = aEnd;
      }
      for (const o of state.overlays) {
        const oEnd = o.startAt + o.duration;
        if (oEnd > total) total = oEnd;
      }
      state.totalDuration = total;
      if (state.playhead > total) state.playhead = total;
      document.getElementById('ycTotalTime').textContent = 'Total ' + fmtTime(total);
      document.getElementById('ycCurrentTime').textContent = fmtTime(state.playhead);
    }

    function fmtTime(sec) {
      const s = Math.max(0, sec || 0);
      const m = Math.floor(s / 60);
      const r = (s % 60).toFixed(1).padStart(4, '0');
      return `${m}:${r}`;
    }

    function zoomTimeline(delta) {
      state.pxPerSec = Math.max(16, Math.min(90, state.pxPerSec + delta));
      renderTimeline();
      syncScrollToPlayhead();
    }

    function syncScrollToPlayhead() {
      const vp = document.getElementById('ycTimelineViewport');
      if (!vp) return;
      state.suppressScrollSync = true;
      vp.scrollLeft = state.playhead * state.pxPerSec;
      document.getElementById('ycCurrentTime').textContent = fmtTime(state.playhead);
      requestAnimationFrame(() => { state.suppressScrollSync = false; });
    }

    function handleTimelineScroll() {
      if (state.suppressScrollSync || state.isPlaying) return;
      const vp = document.getElementById('ycTimelineViewport');
      const sec = Math.max(0, Math.min(state.totalDuration, vp.scrollLeft / state.pxPerSec));
      state.playhead = sec;
      document.getElementById('ycCurrentTime').textContent = fmtTime(sec);
      const info = getClipAtTime(sec);
      if (info && info.clip.type === 'video') {
        const v = info.clip.mediaEl;
        const target = info.clip.trimStart + info.localOffset * info.clip.speed;
        if (Math.abs(v.currentTime - target) > 0.08) {
          v.currentTime = target;
          v.onseeked = () => drawFrame();
        }
      }
      drawFrame();
    }

    // Pack overlapping items into non-overlapping multi-track lanes!
    function packIntoLanes(items, getSpan) {
      const lanes = [];
      for (const item of items) {
        const { start, end } = getSpan(item);
        let placed = false;
        for (const lane of lanes) {
          const last = lane[lane.length - 1];
          if (getSpan(last).end <= start + 0.02) {
            lane.push(item);
            placed = true;
            break;
          }
        }
        if (!placed) lanes.push([item]);
      }
      return lanes;
    }

    function renderTimeline() {
      const videoTrack = document.getElementById('ycVideoTrack');
      const audioLanesEl = document.getElementById('ycAudioLanes');
      const overlayLanesEl = document.getElementById('ycOverlayLanes');
      const rulerEl = document.getElementById('ycRulerTrack');

      const totalPx = Math.max(240, Math.ceil(state.totalDuration * state.pxPerSec));

      // Time Ruler
      let rulerHtml = '';
      const stepSec = state.pxPerSec >= 45 ? 2 : 5;
      for (let t = 0; t <= Math.ceil(state.totalDuration) + stepSec; t += stepSec) {
        rulerHtml += `<span style="position:absolute; left:${t * state.pxPerSec}px;">${fmtTime(t).slice(0, -2)}</span>`;
      }
      rulerEl.style.width = totalPx + 'px';
      rulerEl.innerHTML = rulerHtml;

      // Multi-Track Text / Sticker / PNG / PIP Lanes
      if (!state.overlays.length) {
        overlayLanesEl.innerHTML = '';
      } else {
        const lanes = packIntoLanes(
          [...state.overlays].sort((a, b) => a.startAt - b.startAt),
          o => ({ start: o.startAt, end: o.startAt + o.duration })
        );
        overlayLanesEl.innerHTML = lanes.map(lane => {
          const itemsHtml = lane.map(o => {
            const left = Math.round(o.startAt * state.pxPerSec);
            const w = Math.max(46, Math.round(o.duration * state.pxPerSec));
            const isSel = state.selectedOverlayId === o.id;
            const icon = o.kind === 'text' ? 'T' : (o.kind === 'png' || o.kind === 'pip') ? '🖼' : '★';
            const cls = o.kind === 'text' ? 'bg-sky-100 border-sky-300 text-sky-900' : 'bg-purple-100 border-purple-300 text-purple-900';
            return `
              <div onclick="selectOverlay('${o.id}', event)" style="position:absolute; left:${left}px; width:${w}px;"
                class="h-6 rounded border ${isSel ? 'border-[#ff5722] ring-1 ring-[#ff5722] bg-sky-200 text-sky-950' : cls} flex items-center overflow-hidden cursor-pointer select-none">
                ${isSel ? `<span onpointerdown="startOverlayResize('${o.id}','left',event)" class="w-4 h-full bg-[#ff5722] text-white flex items-center justify-center text-[9px] font-black cursor-ew-resize flex-shrink-0 touch-none">&lsaquo;</span>` : ''}
                <div class="flex-1 min-w-0 px-1 flex items-center gap-1">
                  <span class="text-[9px] font-bold">${icon}</span>
                  <span class="text-[9.5px] font-medium truncate">${escapeHtml(o.text)}</span>
                </div>
                ${isSel ? `<span onpointerdown="startOverlayResize('${o.id}','right',event)" class="w-4 h-full bg-[#ff5722] text-white flex items-center justify-center text-[9px] font-black cursor-ew-resize flex-shrink-0 touch-none">&rsaquo;</span>` : ''}
              </div>`;
          }).join('');
          return `<div class="relative h-6" style="width:${totalPx}px">${itemsHtml}</div>`;
        }).join('');
      }

      // Multi-Track Audio / Music / Voiceover Lanes
      if (!state.audioClips.length) {
        audioLanesEl.innerHTML = '';
      } else {
        const lanes = packIntoLanes(
          [...state.audioClips].sort((a, b) => a.startAt - b.startAt),
          a => ({ start: a.startAt, end: a.startAt + Math.max(0.2, (a.trimEnd - a.trimStart) / (a.speed || 1)) })
        );
        audioLanesEl.innerHTML = lanes.map(lane => {
          const itemsHtml = lane.map(a => {
            const dur = Math.max(0.2, (a.trimEnd - a.trimStart) / (a.speed || 1));
            const left = Math.round(a.startAt * state.pxPerSec);
            const w = Math.max(52, Math.round(dur * state.pxPerSec));
            const isSel = state.selectedAudioId === a.id;
            return `
              <div onclick="selectAudioClip('${a.id}', event)" style="position:absolute; left:${left}px; width:${w}px;"
                class="h-6 rounded bg-amber-300/90 border ${isSel ? 'border-[#ff5722] ring-1 ring-[#ff5722]' : 'border-amber-400'} px-1.5 flex items-center gap-1 cursor-pointer">
                <i class="fa-solid fa-music text-[9px] text-amber-950"></i>
                <span class="text-[10px] font-bold text-amber-950 truncate">${escapeHtml(a.name)}</span>
                <span class="text-[9px] font-semibold text-amber-900 ml-auto">${fmtTime(dur)}</span>
              </div>`;
          }).join('');
          return `<div class="relative h-6" style="width:${totalPx}px">${itemsHtml}</div>`;
        }).join('');
      }

      // Main Video / Photo Filmstrip Track (Zero-Gap Joined Clips)
      if (!state.clips.length) {
        videoTrack.innerHTML = '<div class="text-[11px] text-gray-400 px-2">Tap + to add Video or Photo</div>';
        document.getElementById('ycEmptyTap').classList.remove('hidden');
      } else {
        document.getElementById('ycEmptyTap').classList.add('hidden');
        let html = '';
        let accTime = 0;
        state.clips.forEach((c, idx) => {
          const dur = getClipEffectiveDur(c);
          const clipStart = accTime;
          accTime += dur;
          const w = Math.max(54, Math.round(dur * state.pxPerSec));
          const isSel = state.selectedClipId === c.id;

          let thumbsHtml = '';
          if (c.thumbs && c.thumbs.length === 1) {
            thumbsHtml = `<img src="${c.thumbs[0]}" class="w-full h-full object-cover block" alt="" />`;
          } else if (c.thumbs && c.thumbs.length > 1) {
            thumbsHtml = c.thumbs.map(src => `<img src="${src}" class="flex-1 w-0 h-full object-cover block" alt="" />`).join('');
          } else {
            thumbsHtml = `<div class="w-full h-full bg-gray-200 flex items-center justify-center text-[10px] text-gray-500 truncate px-1">${escapeHtml(c.name)}</div>`;
          }

          html += `
            <div onclick="selectClipAt('${c.id}', ${clipStart}, ${dur}, event)" style="width:${w}px"
              class="relative h-12 overflow-hidden flex flex-shrink-0 cursor-pointer box-border ${isSel ? 'border-2 border-[#ff5722] rounded-sm z-10' : 'border-y border-r border-gray-300 first:border-l first:rounded-l-md last:rounded-r-md'}">
              ${thumbsHtml}
              <span class="absolute bottom-0.5 right-1 bg-black/65 text-white text-[9px] font-semibold px-1 rounded leading-tight">${fmtTime(dur)}</span>
              ${c.type === 'video' ? `<span class="absolute bottom-0.5 left-1 bg-black/65 text-white text-[8.5px] px-1 rounded leading-tight"><i class="fa-solid fa-volume-high text-[7.5px]"></i> ${Math.round((c.volume ?? 1)*100)}%</span>` : ''}
            </div>
          `;

          if (idx < state.clips.length - 1) {
            const hasTr = c.transitionAfter && c.transitionAfter !== 'none';
            html += `
              <button type="button" onclick="openTransitionPicker(${idx}, event)" title="Transition"
                class="relative z-10 -mx-2.5 w-5 h-5 rounded bg-white border ${hasTr ? 'border-[#ff5722] text-[#ff5722]' : 'border-gray-300 text-gray-500'} shadow-sm flex items-center justify-center flex-shrink-0 text-[9px]">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
              </button>
            `;
          }
        });
        videoTrack.innerHTML = html;
      }

      renderToolbar();
    }

    // Tapping a video clip selects it AND moves the playhead line to that clip!
    function selectClipAt(id, clipStart, clipDur, ev) {
      if (ev) ev.stopPropagation();
      state.selectedClipId = id;
      state.selectedAudioId = null;
      state.selectedOverlayId = null;
      // Move playhead to where user tapped inside the clip
      if (ev && ev.currentTarget) {
        const rect = ev.currentTarget.getBoundingClientRect();
        const frac = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
        seekTo(clipStart + frac * clipDur, true);
      } else {
        seekTo(clipStart, true);
      }
      renderTimeline();
    }

    function selectAudioClip(id, ev) {
      if (ev) ev.stopPropagation();
      const ac = state.audioClips.find(a => a.id === id);
      state.selectedAudioId = id;
      state.selectedClipId = null;
      state.selectedOverlayId = null;
      if (ac) seekTo(ac.startAt, true);
      renderTimeline();
    }

    function selectOverlay(id, ev) {
      if (ev) ev.stopPropagation();
      const ov = state.overlays.find(o => o.id === id);
      state.selectedOverlayId = id;
      state.selectedClipId = null;
      state.selectedAudioId = null;
      if (ov) seekTo(ov.startAt, true);
      renderTimeline();
      openTool(ov && (ov.kind === 'sticker' || ov.kind === 'badge' || ov.kind === 'png' || ov.kind === 'pip') ? 'sticker' : 'text');
    }

    function deselectAll() {
      state.selectedClipId = null;
      state.selectedAudioId = null;
      state.selectedOverlayId = null;
      state.selectedTransitionIdx = null;
      closeToolDrawer();
      renderTimeline();
    }

    function openTransitionPicker(idx, ev) {
      if (ev) ev.stopPropagation();
      state.selectedTransitionIdx = idx;
      openTool('transition');
    }

    function handleToolClick(toolId) {
      if (toolId === 'music') { openMusicModal(); return; }
      if (toolId === 'addNewText') { state.selectedOverlayId = null; renderTimeline(); openTool('text'); return; }
      if (toolId === 'ovSplit') { splitSelectedOverlayAtPlayhead(); return; }
      if (toolId === 'ovToEnd') { stretchOverlayToVideoEnd(); return; }
      if (toolId === 'ovCopy') { duplicateSelectedOverlay(); return; }
      if (toolId === 'ovDelete') { deleteSelectedOverlay(); return; }
      if (toolId === 'pip') { document.getElementById('ycPipInput').click(); return; }
      if (toolId === 'split') { splitAtPlayhead(); return; }
      if (toolId === 'duplicate') { duplicateSelectedClip(); return; }
      if (toolId === 'deleteClip') { deleteSelectedClip(); return; }
      if (toolId === 'rotate') { rotateSelectedClip(); return; }
      if (toolId === 'audioDelete') { deleteSelectedAudio(); return; }
      if (toolId === 'audioCopy') { duplicateSelectedAudio(); return; }
      if (toolId === 'audioSplit') { splitSelectedAudioAtPlayhead(); return; }
      openTool(toolId);
    }

    function openTool(toolId) {
      state.activeTool = toolId;
      renderToolbar();
      const drawer = document.getElementById('ycToolDrawer');
      const title = document.getElementById('ycDrawerTitle');
      const body = document.getElementById('ycDrawerBody');
      drawer.classList.remove('hidden');

      const clip = getActiveClip();
      const ac = state.audioClips.find(a => a.id === state.selectedAudioId);

      if (toolId === 'transition') {
        title.textContent = 'Clip Transition';
        const trClip = state.clips[state.selectedTransitionIdx];
        if (!trClip) return;
        body.innerHTML = `<div class="flex gap-2 overflow-x-auto yc-scroll py-1">` + TRANSITIONS.map(t => `
          <button type="button" onclick="setClipTransition('${t.id}')" class="px-3 py-1.5 rounded-lg border text-xs font-semibold flex-shrink-0 ${trClip.transitionAfter === t.id ? 'border-[#ff5722] bg-orange-50 text-[#ff5722]' : 'border-gray-200 bg-white text-gray-700'}">${t.name}</button>
        `).join('') + `</div>`;
      } else if (toolId === 'trim') {
        title.textContent = clip && clip.type === 'image' ? 'Photo Duration' : 'Trim Clip';
        if (!clip) { body.innerHTML = '<p class="text-gray-500">Add a video or photo first.</p>'; return; }
        if (clip.type === 'image') {
          body.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="text-[11px] font-semibold">Duration</span>
              <input type="range" min="1" max="15" step="0.5" value="${clip.trimEnd}" oninput="updatePhotoDuration(this.value)" class="flex-1 yc-range" />
              <span id="ycPhotoDurVal" class="font-bold text-[#ff5722] w-10 text-right">${clip.trimEnd.toFixed(1)}s</span>
            </div>`;
        } else {
          body.innerHTML = `
            <div class="grid grid-cols-2 gap-3">
              <div>
                <div class="flex justify-between text-[11px] font-semibold"><span>Start</span><span id="ycTrimS">${clip.trimStart.toFixed(1)}s</span></div>
                <input type="range" min="0" max="${Math.max(0.5, clip.duration - 0.2)}" step="0.1" value="${clip.trimStart}" oninput="updateClipTrim('start', this.value)" class="w-full yc-range" />
              </div>
              <div>
                <div class="flex justify-between text-[11px] font-semibold"><span>End</span><span id="ycTrimE">${clip.trimEnd.toFixed(1)}s</span></div>
                <input type="range" min="0.2" max="${clip.duration}" step="0.1" value="${clip.trimEnd}" oninput="updateClipTrim('end', this.value)" class="w-full yc-range" />
              </div>
            </div>`;
        }
      } else if (toolId === 'filter') {
        title.textContent = 'Filter';
        if (!clip) { body.innerHTML = '<p class="text-gray-500">Add a video or photo first.</p>'; return; }
        body.innerHTML = `<div class="flex gap-2 overflow-x-auto yc-scroll py-1">` + FILTER_PRESETS.map(f => `
          <button type="button" onclick="applyClipFilter('${f.id}')" class="px-3 py-1.5 rounded-lg border text-xs font-semibold flex-shrink-0 ${clip.filter === f.id ? 'border-[#ff5722] bg-orange-50 text-[#ff5722]' : 'border-gray-200 bg-white text-gray-700'}">${f.name}</button>
        `).join('') + `</div>`;
      } else if (toolId === 'fx') {
        title.textContent = 'FX Effects';
        if (!clip) { body.innerHTML = '<p class="text-gray-500">Add a video or photo first.</p>'; return; }
        body.innerHTML = `<div class="flex gap-2 overflow-x-auto yc-scroll py-1">` + FX_PRESETS.map(f => `
          <button type="button" onclick="applyClipFx('${f.id}')" class="px-3 py-1.5 rounded-lg border text-xs font-semibold flex-shrink-0 ${clip.fx === f.id ? 'border-[#ff5722] bg-orange-50 text-[#ff5722]' : 'border-gray-200 bg-white text-gray-700'}">${f.name}</button>
        `).join('') + `</div>`;
      } else if (toolId === 'adjust') {
        title.textContent = 'Color Adjust';
        if (!clip) return;
        body.innerHTML = `
          <div class="grid grid-cols-3 gap-2 text-[10px]">
            <div><span>Brightness</span><input type="range" min="60" max="150" value="${clip.adj.b}" oninput="updateAdj('b',this.value)" class="w-full yc-range" /></div>
            <div><span>Contrast</span><input type="range" min="60" max="150" value="${clip.adj.c}" oninput="updateAdj('c',this.value)" class="w-full yc-range" /></div>
            <div><span>Saturation</span><input type="range" min="0" max="200" value="${clip.adj.s}" oninput="updateAdj('s',this.value)" class="w-full yc-range" /></div>
          </div>`;
      } else if (toolId === 'bg') {
        title.textContent = 'Video Background';
        body.innerHTML = `<div class="flex gap-2 overflow-x-auto yc-scroll py-1">` + BG_MODES.map(b => `
          <button type="button" onclick="setBgMode('${b.id}')" class="px-3 py-1.5 rounded-lg border text-xs font-semibold flex-shrink-0 ${state.bgMode === b.id ? 'border-[#ff5722] bg-orange-50 text-[#ff5722]' : 'border-gray-200 bg-white text-gray-700'}">${b.name}</button>
        `).join('') + `</div>`;
      } else if (toolId === 'crop') {
        title.textContent = 'Zoom & Crop';
        if (!clip) return;
        body.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-[11px] font-semibold">Zoom</span>
            <input type="range" min="1" max="2.5" step="0.05" value="${clip.cropScale || 1}" oninput="updateCropScale(this.value)" class="flex-1 yc-range" />
            <span id="ycCropVal" class="font-bold text-[#ff5722] w-10 text-right">${(clip.cropScale || 1).toFixed(1)}x</span>
          </div>`;
      } else if (toolId === 'flip') {
        title.textContent = 'Flip Video';
        if (!clip) return;
        body.innerHTML = `
          <div class="flex gap-3">
            <button type="button" onclick="toggleFlip('h')" class="flex-1 py-2 rounded-lg border border-gray-200 bg-white font-semibold">Flip Horizontal</button>
            <button type="button" onclick="toggleFlip('v')" class="flex-1 py-2 rounded-lg border border-gray-200 bg-white font-semibold">Flip Vertical</button>
          </div>`;
      } else if (toolId === 'speed') {
        title.textContent = 'Speed';
        if (!clip) return;
        body.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="range" min="0.5" max="3" step="0.25" value="${clip.speed}" oninput="updateClipSpeed(this.value)" class="flex-1 yc-range" />
            <span id="ycSpeedVal" class="font-bold text-[#ff5722] w-10 text-right">${clip.speed}x</span>
          </div>`;
      } else if (toolId === 'volume') {
        title.textContent = 'Clip Volume';
        if (!clip) return;
        body.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="range" min="0" max="2" step="0.1" value="${clip.volume}" oninput="updateClipVolume(this.value)" class="flex-1 yc-range" />
            <span id="ycVolVal" class="font-bold text-[#ff5722] w-10 text-right">${Math.round(clip.volume * 100)}%</span>
          </div>`;
      } else if (toolId === 'text' || toolId === 'captions') {
        title.textContent = toolId === 'captions' ? 'Multi-Captions' : 'Multi-Text Overlay';
        const ov = state.overlays.find(o => o.id === state.selectedOverlayId && o.kind === 'text') || null;
        const maxDur = Math.max(15, Math.ceil(state.totalDuration || 30));
        body.innerHTML = `
          <div class="flex gap-2">
            <input id="ycTextInput" type="text" placeholder="Type new text here..." value="${ov ? escapeHtml(ov.text) : ''}" class="flex-1 border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-xs" />
            <input id="ycTextColor" type="color" value="${ov ? ov.color : '#ffffff'}" class="w-9 h-8 rounded border border-gray-200 bg-white p-0.5" />
            <button type="button" onclick="addOrUpdateText(false)" class="bg-[#ff5722] text-white font-bold px-3 rounded-lg text-xs">${ov ? 'Save' : 'Add'}</button>
            ${ov ? `<button type="button" onclick="addOrUpdateText(true)" class="bg-gray-800 text-white font-bold px-2.5 rounded-lg text-xs">+ New</button>` : ''}
          </div>
          ${ov ? `<div class="flex items-center gap-2 pt-1">
            <div class="flex-1">
              <div class="flex justify-between text-[10px]"><span>Duration (drag &lsaquo; &rsaquo; on timeline)</span><span>${ov.duration.toFixed(1)}s</span></div>
              <input type="range" min="0.5" max="${maxDur}" step="0.5" value="${ov.duration}" oninput="updateOverlayProp('duration',this.value)" class="w-full yc-range" />
            </div>
            <button type="button" onclick="stretchOverlayToVideoEnd()" class="px-2.5 py-1 rounded bg-orange-50 border border-[#ff5722] text-[#ff5722] font-bold text-[10px] flex-shrink-0">To End</button>
          </div>` : '<p class="text-[10px] text-gray-500">Each text adds separately. Drag &rsaquo; handle on timeline to stretch to video end!</p>'}`;
      } else if (toolId === 'sticker') {
        title.textContent = 'Stickers & PNG Upload';
        const ov = state.overlays.find(o => o.id === state.selectedOverlayId && o.kind !== 'text') || null;
        body.innerHTML = `
          <div class="flex items-center gap-2 overflow-x-auto yc-scroll py-1">
            <button type="button" onclick="document.getElementById('ycPngStickerInput').click()" class="px-2.5 py-1.5 rounded-lg bg-[#ff5722] text-white text-[11px] font-bold flex-shrink-0 flex items-center gap-1">
              <i class="fa-solid fa-image"></i> + PNG
            </button>
            ${BADGE_STICKERS.map(b => `
              <button type="button" onclick="addBadgeSticker('${b.id}')" style="background:${b.bg}; color:${b.fg}" class="px-2.5 py-1.5 rounded-full text-[10px] font-extrabold flex-shrink-0 shadow-sm">${b.label}</button>
            `).join('')}
            ${STICKERS.map(s => `
              <button type="button" onclick="addSticker('${s}')" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-base flex items-center justify-center flex-shrink-0">${s}</button>
            `).join('')}
          </div>
          ${ov ? `<div class="grid grid-cols-2 gap-3 pt-1">
            <div><span class="text-[10px]">Size</span><input type="range" min="30" max="220" step="4" value="${ov.size}" oninput="updateOverlayProp('size',this.value)" class="w-full yc-range" /></div>
            <div class="flex items-end justify-between">
              <span class="text-[10px]">Dur: ${ov.duration.toFixed(1)}s</span>
              <button type="button" onclick="deleteSelectedOverlay()" class="text-red-500 font-semibold text-[11px]">Delete</button>
            </div>
          </div>` : ''}`;
      } else if (toolId === 'audioTrim' && ac) {
        title.textContent = 'Trim Audio';
        body.innerHTML = `
          <div class="grid grid-cols-2 gap-3">
            <div><span class="text-[10px]">Start: ${ac.trimStart.toFixed(1)}s</span><input type="range" min="0" max="${Math.max(0.5, ac.trimEnd - 0.2)}" step="0.1" value="${ac.trimStart}" oninput="updateTimelineAudioTrim('start',this.value)" class="w-full yc-range" /></div>
            <div><span class="text-[10px]">End: ${ac.trimEnd.toFixed(1)}s</span><input type="range" min="0.2" max="${ac.audioEl.duration || ac.trimEnd}" step="0.1" value="${ac.trimEnd}" oninput="updateTimelineAudioTrim('end',this.value)" class="w-full yc-range" /></div>
          </div>`;
      } else if (toolId === 'audioVol' && ac) {
        title.textContent = 'Music Volume';
        body.innerHTML = `<input type="range" min="0" max="1.5" step="0.1" value="${ac.volume}" oninput="updateSelectedAudioVol(this.value)" class="w-full yc-range" />`;
      } else if (toolId === 'audioFade' && ac) {
        title.textContent = 'Audio Fade In / Out';
        body.innerHTML = `
          <div class="flex gap-3">
            <button type="button" onclick="toggleAudioFade('in')" class="flex-1 py-1.5 rounded-lg border text-xs font-semibold ${ac.fadeIn ? 'border-[#ff5722] text-[#ff5722] bg-orange-50' : 'border-gray-200 bg-white'}">Fade In</button>
            <button type="button" onclick="toggleAudioFade('out')" class="flex-1 py-1.5 rounded-lg border text-xs font-semibold ${ac.fadeOut ? 'border-[#ff5722] text-[#ff5722] bg-orange-50' : 'border-gray-200 bg-white'}">Fade Out</button>
          </div>`;
      } else if (toolId === 'audioSpeed' && ac) {
        title.textContent = 'Audio Speed';
        body.innerHTML = `<input type="range" min="0.5" max="2" step="0.1" value="${ac.speed || 1}" oninput="updateSelectedAudioSpeed(this.value)" class="w-full yc-range" />`;
      }
    }

    function closeToolDrawer() {
      state.activeTool = null;
      if (state.selectedOverlayId) {
        state.selectedOverlayId = null;
        renderTimeline();
      }
      document.getElementById('ycToolDrawer').classList.add('hidden');
      renderToolbar();
    }

    function getActiveClip() {
      if (state.selectedClipId) return state.clips.find(c => c.id === state.selectedClipId) || null;
      const info = getClipAtTime(state.playhead);
      return info ? info.clip : (state.clips[0] || null);
    }

    // ==================== CLIP & TRANSITION ACTIONS ====================
    function setClipTransition(trId) {
      const c = state.clips[state.selectedTransitionIdx];
      if (!c) return;
      saveSnapshot();
      c.transitionAfter = trId;
      openTool('transition');
      renderTimeline();
    }

    function updatePhotoDuration(val) {
      const clip = getActiveClip();
      if (!clip) return;
      clip.duration = parseFloat(val);
      clip.trimEnd = clip.duration;
      document.getElementById('ycPhotoDurVal').textContent = clip.duration.toFixed(1) + 's';
      recomputeDuration();
      renderTimeline();
    }

    function updateClipTrim(which, val) {
      const clip = getActiveClip();
      if (!clip) return;
      const v = parseFloat(val);
      if (which === 'start') {
        clip.trimStart = Math.min(v, clip.trimEnd - 0.2);
        document.getElementById('ycTrimS').textContent = clip.trimStart.toFixed(1) + 's';
      } else {
        clip.trimEnd = Math.max(v, clip.trimStart + 0.2);
        document.getElementById('ycTrimE').textContent = clip.trimEnd.toFixed(1) + 's';
      }
      recomputeDuration();
      renderTimeline();
      drawFrame();
    }

    function splitAtPlayhead() {
      const info = getClipAtTime(state.playhead);
      if (!info) return;
      const { clip, localOffset, idx } = info;
      const effDur = getClipEffectiveDur(clip);
      if (localOffset <= 0.15 || localOffset >= effDur - 0.15) {
        showToast('Move playhead inside a clip to split.');
        return;
      }
      saveSnapshot();
      const splitPoint = clip.trimStart + localOffset * clip.speed;
      const second = { ...clip, id: 'clip_' + Date.now() + '_sp', trimStart: splitPoint, thumbs: [...clip.thumbs] };
      clip.trimEnd = splitPoint;
      state.clips.splice(idx + 1, 0, second);
      recomputeDuration();
      renderTimeline();
      drawFrame();
    }

    function applyClipFilter(filterId) { const c = getActiveClip(); if (c) { saveSnapshot(); c.filter = filterId; openTool('filter'); drawFrame(); } }
    function applyClipFx(fxId) { const c = getActiveClip(); if (c) { saveSnapshot(); c.fx = fxId; openTool('fx'); drawFrame(); } }
    function updateAdj(key, val) { const c = getActiveClip(); if (c) { c.adj[key] = parseInt(val, 10); drawFrame(); } }
    function setBgMode(mode) { state.bgMode = mode; openTool('bg'); drawFrame(); }
    function updateCropScale(val) { const c = getActiveClip(); if (c) { c.cropScale = parseFloat(val); document.getElementById('ycCropVal').textContent = c.cropScale.toFixed(1) + 'x'; drawFrame(); } }
    function toggleFlip(dir) { const c = getActiveClip(); if (c) { saveSnapshot(); if (dir === 'h') c.flipH = !c.flipH; else c.flipV = !c.flipV; drawFrame(); } }
    function updateClipSpeed(val) { const c = getActiveClip(); if (c) { c.speed = parseFloat(val); document.getElementById('ycSpeedVal').textContent = c.speed + 'x'; recomputeDuration(); renderTimeline(); } }
    function updateClipVolume(val) { const c = getActiveClip(); if (c) { c.volume = parseFloat(val); document.getElementById('ycVolVal').textContent = Math.round(c.volume * 100) + '%'; renderTimeline(); } }
    function rotateSelectedClip() { const c = getActiveClip(); if (c) { saveSnapshot(); c.rotate = ((c.rotate || 0) + 90) % 360; drawFrame(); } }

    function duplicateSelectedClip() {
      const clip = getActiveClip();
      if (!clip) return;
      saveSnapshot();
      const idx = state.clips.findIndex(c => c.id === clip.id);
      state.clips.splice(idx + 1, 0, { ...clip, id: 'clip_' + Date.now() + '_cp', thumbs: [...clip.thumbs] });
      recomputeDuration();
      renderTimeline();
    }

    function deleteSelectedClip() {
      const clip = getActiveClip();
      if (!clip) return;
      saveSnapshot();
      state.clips = state.clips.filter(c => c.id !== clip.id);
      state.selectedClipId = null;
      closeToolDrawer();
      recomputeDuration();
      renderTimeline();
      drawFrame();
    }

    function toggleGlobalMute() {
      state.mutedGlobal = !state.mutedGlobal;
      const btn = document.getElementById('ycMuteBtn');
      btn.innerHTML = state.mutedGlobal
        ? '<i class="fa-solid fa-volume-xmark text-xs mb-0.5 text-gray-400"></i><span>Unmute clip</span>'
        : '<i class="fa-solid fa-volume-high text-xs mb-0.5 text-[#ff5722]"></i><span>Mute clip</span>';
    }

    // ==================== MULTI-TEXT, BADGE STICKERS, PNG STICKERS & PIP ====================
    function addOrUpdateText(forceNew) {
      const txt = document.getElementById('ycTextInput').value.trim();
      const color = document.getElementById('ycTextColor').value;
      if (!txt) return;
      saveSnapshot();
      const existing = !forceNew ? state.overlays.find(o => o.id === state.selectedOverlayId && o.kind === 'text') : null;
      if (existing) {
        existing.text = txt;
        existing.color = color;
      } else {
        const ov = {
          id: 'ov_' + Date.now(), kind: 'text', text: txt, color,
          x: canvas.width / 2, y: canvas.height * (0.25 + (state.overlays.length % 4) * 0.16), size: 40,
          startAt: state.playhead, duration: 3.5
        };
        state.overlays.push(ov);
        state.selectedOverlayId = ov.id;
      }
      recomputeDuration();
      renderTimeline();
      openTool('text');
      drawFrame();
    }

    function addSticker(emoji) {
      saveSnapshot();
      const ov = {
        id: 'ov_' + Date.now(), kind: 'sticker', text: emoji, color: '#ffffff',
        x: canvas.width / 2, y: canvas.height / 2, size: 84,
        startAt: state.playhead, duration: 3
      };
      state.overlays.push(ov);
      state.selectedOverlayId = ov.id;
      recomputeDuration();
      renderTimeline();
      openTool('sticker');
      drawFrame();
    }

    function addBadgeSticker(badgeId) {
      const b = BADGE_STICKERS.find(x => x.id === badgeId);
      if (!b) return;
      saveSnapshot();
      const ov = {
        id: 'ov_' + Date.now(), kind: 'badge', text: b.label, color: b.fg, bgColor: b.bg,
        x: canvas.width / 2, y: canvas.height * 0.82, size: 28,
        startAt: state.playhead, duration: 4
      };
      state.overlays.push(ov);
      state.selectedOverlayId = ov.id;
      recomputeDuration();
      renderTimeline();
      openTool('sticker');
      drawFrame();
    }

    async function handleCustomPngSticker(files) {
      if (!files || !files.length) return;
      await addImageOverlay(files[0], 'png');
      document.getElementById('ycPngStickerInput').value = '';
    }

    async function handlePipUpload(files) {
      if (!files || !files.length) return;
      await addImageOverlay(files[0], 'pip');
      document.getElementById('ycPipInput').value = '';
    }

    async function addImageOverlay(file, kind) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.src = url;
      await new Promise(r => { img.onload = r; img.onerror = r; });
      saveSnapshot();
      const ov = {
        id: 'ov_' + Date.now(), kind, text: file.name, imgEl: img,
        x: canvas.width / 2, y: canvas.height / 2, size: kind === 'pip' ? 180 : 120,
        startAt: state.playhead, duration: 4
      };
      state.overlays.push(ov);
      state.selectedOverlayId = ov.id;
      recomputeDuration();
      renderTimeline();
      openTool('sticker');
      drawFrame();
    }

    function updateOverlayProp(prop, val) {
      const ov = state.overlays.find(o => o.id === state.selectedOverlayId);
      if (!ov) return;
      ov[prop] = parseFloat(val);
      recomputeDuration();
      renderTimeline();
      drawFrame();
    }

    let resizingOv = null;
    function startOverlayResize(id, side, ev) {
      ev.stopPropagation();
      ev.preventDefault();
      const ov = state.overlays.find(o => o.id === id);
      if (!ov) return;
      saveSnapshot();
      resizingOv = {
        ov,
        side,
        startX: ev.clientX,
        origStart: ov.startAt,
        origDur: ov.duration
      };
    }

    window.addEventListener('pointermove', e => {
      if (!resizingOv) return;
      const dt = (e.clientX - resizingOv.startX) / state.pxPerSec;
      const ov = resizingOv.ov;
      if (resizingOv.side === 'right') {
        ov.duration = Math.max(0.4, resizingOv.origDur + dt);
      } else {
        const newStart = Math.max(0, Math.min(resizingOv.origStart + resizingOv.origDur - 0.4, resizingOv.origStart + dt));
        ov.duration = resizingOv.origDur - (newStart - resizingOv.origStart);
        ov.startAt = newStart;
      }
      recomputeDuration();
      renderTimeline();
      drawFrame();
    });

    window.addEventListener('pointerup', () => { resizingOv = null; });

    function getMainVideoDuration() {
      return state.clips.reduce((acc, c) => acc + getClipEffectiveDur(c), 0);
    }

    function stretchOverlayToVideoEnd() {
      const ov = state.overlays.find(o => o.id === state.selectedOverlayId);
      if (!ov) return;
      const vidEnd = Math.max(getMainVideoDuration(), state.totalDuration);
      if (vidEnd <= ov.startAt + 0.3) {
        showToast('Already at video end.');
        return;
      }
      saveSnapshot();
      ov.duration = vidEnd - ov.startAt;
      recomputeDuration();
      renderTimeline();
      if (state.activeTool === 'text' || state.activeTool === 'captions') openTool(state.activeTool);
      drawFrame();
    }

    function splitSelectedOverlayAtPlayhead() {
      const ov = state.overlays.find(o => o.id === state.selectedOverlayId);
      if (!ov) return;
      const local = state.playhead - ov.startAt;
      if (local <= 0.2 || local >= ov.duration - 0.2) {
        showToast('Move red playhead inside this text/sticker to split.');
        return;
      }
      saveSnapshot();
      const second = { ...ov, id: 'ov_' + Date.now() + '_sp', startAt: state.playhead, duration: ov.duration - local };
      ov.duration = local;
      state.overlays.push(second);
      state.selectedOverlayId = second.id;
      recomputeDuration();
      renderTimeline();
      drawFrame();
    }

    function duplicateSelectedOverlay() {
      const ov = state.overlays.find(o => o.id === state.selectedOverlayId);
      if (!ov) return;
      saveSnapshot();
      const copy = { ...ov, id: 'ov_' + Date.now() + '_cp', startAt: ov.startAt + ov.duration };
      state.overlays.push(copy);
      state.selectedOverlayId = copy.id;
      recomputeDuration();
      renderTimeline();
      drawFrame();
    }

    function deleteSelectedOverlay() {
      saveSnapshot();
      state.overlays = state.overlays.filter(o => o.id !== state.selectedOverlayId);
      state.selectedOverlayId = null;
      closeToolDrawer();
      recomputeDuration();
      renderTimeline();
      drawFrame();
    }

    let draggingOverlay = null;
    canvas.addEventListener('pointerdown', e => {
      if (!state.overlays.length) return;
      const rect = canvas.getBoundingClientRect();
      const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
      const hit = [...state.overlays].reverse().find(o =>
        state.playhead >= o.startAt && state.playhead <= o.startAt + o.duration &&
        Math.abs(o.x - cx) < 130 && Math.abs(o.y - cy) < 70
      );
      if (hit) { draggingOverlay = hit; state.selectedOverlayId = hit.id; }
    });
    canvas.addEventListener('pointermove', e => {
      if (!draggingOverlay) return;
      const rect = canvas.getBoundingClientRect();
      draggingOverlay.x = (e.clientX - rect.left) * (canvas.width / rect.width);
      draggingOverlay.y = (e.clientY - rect.top) * (canvas.height / rect.height);
      drawFrame();
    });
    window.addEventListener('pointerup', () => { draggingOverlay = null; });

    // ==================== PLAYBACK & RENDERING ====================
    function getClipAtTime(t) {
      let acc = 0;
      for (let i = 0; i < state.clips.length; i++) {
        const c = state.clips[i];
        const d = getClipEffectiveDur(c);
        if (t <= acc + d || i === state.clips.length - 1) {
          return { clip: c, idx: i, localOffset: Math.max(0, Math.min(d, t - acc)), clipDur: d };
        }
        acc += d;
      }
      return null;
    }

    function seekTo(sec, syncScroll) {
      state.playhead = Math.max(0, Math.min(state.totalDuration, sec));
      if (syncScroll) syncScrollToPlayhead();
      const info = getClipAtTime(state.playhead);
      if (info && info.clip.type === 'video') {
        const v = info.clip.mediaEl;
        const target = info.clip.trimStart + info.localOffset * info.clip.speed;
        if (Math.abs(v.currentTime - target) > 0.06) {
          v.currentTime = target;
          v.onseeked = () => drawFrame();
        }
      }
      drawFrame();
    }

    function togglePlay() {
      if (state.totalDuration <= 0) return;
      if (state.isPlaying) pausePlayback();
      else startPlayback();
    }

    function startPlayback() {
      if (state.playhead >= state.totalDuration) state.playhead = 0;
      state.isPlaying = true;
      document.getElementById('ycPlayBtn').innerHTML = '<i class="fa-solid fa-pause text-base"></i>';
      lastTick = performance.now();
      rafId = requestAnimationFrame(playbackLoop);
    }

    function pausePlayback() {
      state.isPlaying = false;
      document.getElementById('ycPlayBtn').innerHTML = '<i class="fa-solid fa-play text-base"></i>';
      if (rafId) cancelAnimationFrame(rafId);
      state.clips.forEach(c => { if (c.type === 'video' && c.mediaEl) c.mediaEl.pause(); });
      state.audioClips.forEach(a => { if (a.audioEl) a.audioEl.pause(); });
    }

    function playbackLoop(now) {
      if (!state.isPlaying) return;
      const dt = (now - lastTick) / 1000;
      lastTick = now;
      state.playhead += dt;

      if (state.playhead >= state.totalDuration) {
        state.playhead = state.totalDuration;
        syncScrollToPlayhead();
        drawFrame();
        pausePlayback();
        return;
      }

      const info = getClipAtTime(state.playhead);
      state.clips.forEach(c => {
        if (c.type !== 'video') return;
        const v = c.mediaEl;
        if (info && info.clip.id === c.id) {
          v.muted = state.mutedGlobal;
          v.volume = Math.min(1, c.volume ?? 1);
          v.playbackRate = c.speed || 1;
          const target = c.trimStart + info.localOffset * c.speed;
          if (v.paused) v.play().catch(() => {});
          if (Math.abs(v.currentTime - target) > 0.25) v.currentTime = target;
        } else if (!v.paused) {
          v.pause();
        }
      });

      state.audioClips.forEach(a => {
        const sp = a.speed || 1;
        const dur = (a.trimEnd - a.trimStart) / sp;
        const inRange = state.playhead >= a.startAt && state.playhead <= a.startAt + dur;
        const el = a.audioEl;
        if (!el) return;
        if (inRange) {
          const elapsed = state.playhead - a.startAt;
          let vol = a.volume ?? 1;
          if (a.fadeIn && elapsed < 0.8) vol *= (elapsed / 0.8);
          if (a.fadeOut && dur - elapsed < 0.8) vol *= Math.max(0, (dur - elapsed) / 0.8);
          el.volume = Math.min(1, Math.max(0, vol));
          el.playbackRate = sp;
          if (el.paused) { el.currentTime = a.trimStart + elapsed * sp; el.play().catch(() => {}); }
        } else if (!el.paused) {
          el.pause();
        }
      });

      syncScrollToPlayhead();
      drawFrame();
      rafId = requestAnimationFrame(playbackLoop);
    }

    function drawFrame() {
      const bgObj = BG_MODES.find(b => b.id === state.bgMode) || BG_MODES[0];
      ctx.fillStyle = bgObj.color;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const info = getClipAtTime(state.playhead);
      if (info && info.clip.mediaEl) {
        const c = info.clip;
        const el = c.mediaEl;
        const vw = el.videoWidth || el.naturalWidth || canvas.width;
        const vh = el.videoHeight || el.naturalHeight || canvas.height;
        if (vw > 0 && vh > 0) {
          if (state.bgMode === 'blur') {
            ctx.save();
            ctx.filter = 'blur(22px) brightness(0.75)';
            const bgScale = Math.max(canvas.width / vw, canvas.height / vh);
            ctx.drawImage(el, (canvas.width - vw * bgScale) / 2, (canvas.height - vh * bgScale) / 2, vw * bgScale, vh * bgScale);
            ctx.restore();
          }

          ctx.save();
          const preset = FILTER_PRESETS.find(f => f.id === c.filter);
          const adjCss = `brightness(${c.adj.b}%) contrast(${c.adj.c}%) saturate(${c.adj.s}%)`;
          ctx.filter = ((preset ? preset.css : '') + ' ' + adjCss).trim();

          let alpha = 1, tx = 0, zoomFx = 1;
          if (info.idx > 0 && info.localOffset < 0.5) {
            const prev = state.clips[info.idx - 1];
            const p = info.localOffset / 0.5;
            if (prev.transitionAfter === 'fade') alpha = p;
            else if (prev.transitionAfter === 'slideLeft') tx = (1 - p) * canvas.width;
            else if (prev.transitionAfter === 'slideRight') tx = -(1 - p) * canvas.width;
            else if (prev.transitionAfter === 'zoomIn') zoomFx = 0.75 + 0.25 * p;
          }
          if (c.fx === 'zoom') zoomFx *= 1 + (info.localOffset / Math.max(1, info.clipDur)) * 0.14;
          else if (c.fx === 'pulse') zoomFx *= 1 + Math.abs(Math.sin(state.playhead * 6)) * 0.06;
          else if (c.fx === 'shake') tx += Math.sin(state.playhead * 40) * 6;

          ctx.globalAlpha = alpha;
          ctx.translate(canvas.width / 2 + tx, canvas.height / 2);
          ctx.rotate(((c.rotate || 0) * Math.PI) / 180);
          ctx.scale((c.flipH ? -1 : 1) * (c.cropScale || 1) * zoomFx, (c.flipV ? -1 : 1) * (c.cropScale || 1) * zoomFx);

          const scale = Math.min(canvas.width / vw, canvas.height / vh);
          ctx.drawImage(el, -(vw * scale) / 2, -(vh * scale) / 2, vw * scale, vh * scale);
          ctx.restore();

          if (c.fx === 'vignette') {
            const g = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width*0.2, canvas.width/2, canvas.height/2, canvas.width*0.8);
            g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.65)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
          } else if (c.fx === 'flash' && Math.sin(state.playhead * 14) > 0.85) {
            ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
        }
      }

      // Draw active Text, Badge Stickers, PNG Stickers & PIP
      for (const o of state.overlays) {
        if (state.playhead >= o.startAt && state.playhead <= o.startAt + o.duration) {
          ctx.save();
          if ((o.kind === 'png' || o.kind === 'pip') && o.imgEl) {
            const iw = o.imgEl.naturalWidth || 100;
            const ih = o.imgEl.naturalHeight || 100;
            const dw = o.size;
            const dh = (ih / iw) * dw;
            ctx.drawImage(o.imgEl, o.x - dw / 2, o.y - dh / 2, dw, dh);
          } else if (o.kind === 'badge') {
            ctx.font = `900 ${o.size}px sans-serif`;
            const tw = ctx.measureText(o.text).width;
            const bw = tw + 34;
            const bh = o.size + 22;
            ctx.fillStyle = o.bgColor || '#dc2626';
            ctx.beginPath();
            ctx.roundRect(o.x - bw / 2, o.y - bh / 2, bw, bh, 999);
            ctx.fill();
            ctx.fillStyle = o.color || '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(o.text, o.x, o.y + 1);
          } else {
            ctx.font = `bold ${o.size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (o.kind === 'text') {
              ctx.lineWidth = 5;
              ctx.strokeStyle = 'rgba(0,0,0,0.65)';
              ctx.strokeText(o.text, o.x, o.y);
              ctx.fillStyle = o.color || '#ffffff';
            }
            ctx.fillText(o.text, o.x, o.y);
          }
          ctx.restore();
        }
      }
    }

    async function loadAudioIntoLibrary(name, url, file) {
      const audio = new Audio(url);
      await new Promise(r => { audio.onloadedmetadata = r; audio.onerror = r; });
      const duration = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 10;

      let waveform = Array.from({ length: 64 }, () => 0.25 + Math.random() * 0.65);
      try {
        const buf = await file.arrayBuffer();
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const decoded = await ac.decodeAudioData(buf);
        const ch = decoded.getChannelData(0);
        const step = Math.max(1, Math.floor(ch.length / 64));
        waveform = [];
        for (let i = 0; i < 64; i++) {
          let peak = 0;
          for (let j = 0; j < step; j++) {
            const val = Math.abs(ch[i * step + j] || 0);
            if (val > peak) peak = val;
          }
          waveform.push(Math.max(0.12, peak));
        }
        ac.close();
      } catch (e) {}

      const item = { id: 'aud_' + Date.now(), name, url, duration, waveform };
      state.musicLibrary.unshift(item);
      renderMusicBody();
      openWaveformTrimmer(item.id);
    }

    function openWaveformTrimmer(id) {
      const item = state.musicLibrary.find(m => m.id === id);
      if (!item) return;
      stopPendingAudioPreview();
      state.pendingAudio = { ...item, trimStart: 0, trimEnd: item.duration, previewEl: new Audio(item.url), playing: false };
      document.getElementById('ycAudioTrimmerBar').classList.remove('hidden');
      document.getElementById('ycTrimAudioName').textContent = item.name;
      document.getElementById('ycTrimAudioDur').textContent = fmtTime(item.duration);
      const sSlider = document.getElementById('ycAudioTrimStartSlider');
      const eSlider = document.getElementById('ycAudioTrimEndSlider');
      sSlider.max = item.duration; sSlider.value = 0;
      eSlider.max = item.duration; eSlider.value = item.duration;
      updateAudioTrimPreview();
    }

    function updateAudioTrimPreview() {
      const p = state.pendingAudio;
      if (!p) return;
      let s = parseFloat(document.getElementById('ycAudioTrimStartSlider').value);
      let e = parseFloat(document.getElementById('ycAudioTrimEndSlider').value);
      if (s >= e - 0.2) s = Math.max(0, e - 0.2);
      p.trimStart = s; p.trimEnd = e;
      document.getElementById('ycTrimAudioStart').textContent = fmtTime(s);
      document.getElementById('ycTrimAudioEnd').textContent = fmtTime(e);
      document.getElementById('ycTrimAudioMid').textContent = `${fmtTime(e - s)} / ${fmtTime(p.duration)}`;
      document.getElementById('ycTrimStartVal').textContent = s.toFixed(1) + 's';
      document.getElementById('ycTrimEndVal').textContent = e.toFixed(1) + 's';
      drawWaveformBars(p.waveform, s / p.duration, e / p.duration);
    }

    function drawWaveformBars(waveform, startFrac, endFrac) {
      const wc = document.getElementById('ycWaveformCanvas');
      const wctx = wc.getContext('2d');
      wctx.clearRect(0, 0, wc.width, wc.height);
      const n = waveform.length, barW = wc.width / n;
      for (let i = 0; i < n; i++) {
        const frac = i / n;
        wctx.fillStyle = (frac >= startFrac && frac <= endFrac) ? '#ff5722' : '#525252';
        const bh = Math.max(4, waveform[i] * (wc.height - 8));
        wctx.fillRect(i * barW + 1, (wc.height - bh) / 2, Math.max(2, barW - 2), bh);
      }
    }

    function makeSfxWavUrl(preset) {
      const sr = 22050, len = Math.floor(sr * preset.dur);
      const buf = new ArrayBuffer(44 + len * 2), view = new DataView(buf);
      const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF'); view.setUint32(4, 36 + len * 2, true); writeStr(8, 'WAVE');
      writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
      view.setUint16(22, 1, true); view.setUint32(24, sr, true); view.setUint32(28, sr * 2, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeStr(36, 'data');
      view.setUint32(40, len * 2, true);
      for (let i = 0; i < len; i++) {
        const t = i / sr, env = Math.max(0, 1 - t / preset.dur);
        view.setInt16(44 + i * 2, Math.sin(2 * Math.PI * preset.freq * t) * env * 0.6 * 32767, true);
      }
      return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    }

    function previewSynthSfx(id) {
