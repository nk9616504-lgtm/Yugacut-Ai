      state.audioClips.push({
        id: 'ac_' + Date.now(), name: p.name, url, audioEl: new Audio(url),
        startAt: state.playhead, trimStart: 0, trimEnd: p.dur, volume: 1, fadeIn: false, fadeOut: false, speed: 1, waveform: []
      });
      closeMusicModal();
      recomputeDuration();
      renderTimeline();
    }

    async function toggleVoiceRecord() {
      if (state.isRecordingVoice && state.mediaRecorder) {
        state.mediaRecorder.stop();
        state.isRecordingVoice = false;
        renderMusicBody();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        state.voiceChunks = [];
        const mr = new MediaRecorder(stream);
        mr.ondataavailable = e => { if (e.data.size > 0) state.voiceChunks.push(e.data); };
        mr.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(state.voiceChunks, { type: 'audio/webm' });
          await loadAudioIntoLibrary('Voiceover_' + new Date().toLocaleTimeString(), URL.createObjectURL(blob), blob);
          switchMusicTab('mymusic');
        };
        mr.start();
        state.mediaRecorder = mr;
        state.isRecordingVoice = true;
        renderMusicBody();
      } catch (e) {
        showToast('Microphone permission is needed for Voiceover.');
      }
    }

    function updateTimelineAudioTrim(which, val) {
      const ac = state.audioClips.find(a => a.id === state.selectedAudioId);
      if (!ac) return;
      const v = parseFloat(val);
      if (which === 'start') ac.trimStart = Math.min(v, ac.trimEnd - 0.2);
      else ac.trimEnd = Math.max(v, ac.trimStart + 0.2);
      recomputeDuration(); renderTimeline(); openTool('audioTrim');
    }
    function updateSelectedAudioVol(val) { const ac = state.audioClips.find(a => a.id === state.selectedAudioId); if (ac) ac.volume = parseFloat(val); }
    function toggleAudioFade(which) { const ac = state.audioClips.find(a => a.id === state.selectedAudioId); if (ac) { if (which === 'in') ac.fadeIn = !ac.fadeIn; else ac.fadeOut = !ac.fadeOut; openTool('audioFade'); } }
    function updateSelectedAudioSpeed(val) { const ac = state.audioClips.find(a => a.id === state.selectedAudioId); if (ac) { ac.speed = parseFloat(val); recomputeDuration(); renderTimeline(); } }

    function splitSelectedAudioAtPlayhead() {
      const ac = state.audioClips.find(a => a.id === state.selectedAudioId);
      if (!ac) return;
      const sp = ac.speed || 1, effDur = (ac.trimEnd - ac.trimStart) / sp, local = state.playhead - ac.startAt;
      if (local <= 0.15 || local >= effDur - 0.15) { showToast('Move playhead inside audio to split.'); return; }
      saveSnapshot();
      const cut = ac.trimStart + local * sp;
      state.audioClips.push({ ...ac, id: 'ac_' + Date.now() + '_sp', audioEl: new Audio(ac.url), startAt: state.playhead, trimStart: cut });
      ac.trimEnd = cut;
      recomputeDuration(); renderTimeline();
    }

    function duplicateSelectedAudio() {
      const ac = state.audioClips.find(a => a.id === state.selectedAudioId);
      if (!ac) return;
      saveSnapshot();
      const dur = (ac.trimEnd - ac.trimStart) / (ac.speed || 1);
      state.audioClips.push({ ...ac, id: 'ac_' + Date.now() + '_cp', audioEl: new Audio(ac.url), startAt: ac.startAt + dur });
      recomputeDuration(); renderTimeline();
    }

    function deleteSelectedAudio() {
      saveSnapshot();
      state.audioClips = state.audioClips.filter(a => a.id !== state.selectedAudioId);
      state.selectedAudioId = null;
      closeToolDrawer(); recomputeDuration(); renderTimeline();
    }

    async function startVideoExport(shareAfter) {
      const btn = document.getElementById('ycStartExportBtn');
      const wrap = document.getElementById('ycExportProgressWrap');
      const bar = document.getElementById('ycExportBar');
      const status = document.getElementById('ycExportStatus');
      btn.disabled = true;
      wrap.classList.remove('hidden');
      status.textContent = 'Mixing audio & rendering...';

      const fps = parseInt(document.getElementById('ycExportFps').value, 10) || 30;
      const vidStream = canvas.captureStream(fps);
      const tracks = [...vidStream.getVideoTracks()];

      let mixCtx = null;
      try {
        if (state.audioClips.length) {
          mixCtx = new (window.AudioContext || window.webkitAudioContext)();
          const dest = mixCtx.createMediaStreamDestination();
          for (const a of state.audioClips) {
            const resp = await fetch(a.url);
            const arr = await resp.arrayBuffer();
            const decoded = await mixCtx.decodeAudioData(arr);
            const src = mixCtx.createBufferSource();
            src.buffer = decoded;
            src.playbackRate.value = a.speed || 1;
            const gain = mixCtx.createGain();
            gain.gain.value = a.volume ?? 1;
            src.connect(gain);
            gain.connect(dest);
            src.start(mixCtx.currentTime + a.startAt, a.trimStart, Math.max(0.1, a.trimEnd - a.trimStart));
          }
          tracks.push(...dest.stream.getAudioTracks());
        }
      } catch (e) {}

      const combined = new MediaStream(tracks);
      const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
      const chunks = [];
      const rec = new MediaRecorder(combined, { mimeType: mime });
      rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

      const donePromise = new Promise(res => { rec.onstop = res; });
      rec.start();
      state.playhead = 0;
      startPlayback();

      const timer = setInterval(() => {
        const pct = state.totalDuration > 0 ? Math.min(100, Math.round((state.playhead / state.totalDuration) * 100)) : 100;
        bar.style.width = pct + '%';
        status.textContent = `Exporting ${pct}%...`;
        if (!state.isPlaying) { clearInterval(timer); rec.stop(); }
      }, 100);

      await donePromise;
      if (mixCtx) mixCtx.close().catch(() => {});

      const ext = mime === 'video/mp4' ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: mime });
      const fileName = `YugaCut_${Date.now()}.${ext}`;

      if (shareAfter && navigator.share) {
        try {
          await navigator.share({ files: [new File([blob], fileName, { type: mime })], title: 'YugaCut Video' });
          status.textContent = 'Shared!'; btn.disabled = false; return;
        } catch (e) {}
      }

      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
      status.textContent = 'Saved! Check your Downloads.';
      btn.disabled = false;
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
    }

    renderToolbar();
    renderTimeline();
  </script>
</body>
</html>
